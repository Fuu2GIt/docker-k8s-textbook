apiVersion: apps/v1
kind: Deployment
metadata:
  name: memo
  namespace: memo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: memo
  template:
    metadata:
      labels:
        app: memo
    spec:
      containers:
      - name: web
        image: memo:ch13
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: APP_MESSAGE
          valueFrom:
            configMapKeyRef:
              name: memo
              key: APP_MESSAGE
        - name: APP_TOKEN
          valueFrom:
            secretKeyRef:
              name: memo
              key: APP_TOKEN
